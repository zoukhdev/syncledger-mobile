name: syncledger
description: "SyncLedger — Business invoice management for owner & accountant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Backend ───────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Local Cache (Offline-First) ───────────────────────────
  path_provider: ^2.1.5

  # ── UI & Fonts ────────────────────────────────────────────
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # ── File Picker & Upload ──────────────────────────────────
  file_picker: ^11.0.2
  mime: ^2.0.0

  # ── Android-specific (conditionally imported) ─────────────
  local_auth: ^2.3.0
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1

  # ── Connectivity & Sync ───────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── Notifications ─────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.5.0

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  dio: ^5.8.0+1
  flutter_animate: ^4.5.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  fl_chart: ^0.68.0
  pdf: ^3.11.3
  printing: ^5.14.3
  flutter_native_splash: ^2.4.4
  path: ^1.9.0

  flutter_localizations:
    sdk: flutter
  share_plus: ^12.0.2
  flutter_secure_storage: ^10.3.1
  sqflite_sqlcipher: ^3.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_cropped.png"
  adaptive_icon_background: "#131f37"
  adaptive_icon_foreground: "assets/icon_cropped.png"
  min_sdk_android: 23
